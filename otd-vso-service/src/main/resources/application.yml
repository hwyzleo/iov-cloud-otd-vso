iov:
  # OTD-VSO-DSN-CR-012：VSO 作为 vso.transport.applied 的生产者，启动时声明并预创建该 Topic
  kafka:
    topic-provisioning:
      topics:
        - name: ${VSO_TOPIC_TRANSPORT_APPLIED:vso.transport.applied}
          partitions: 3
          replication-factor: 1
        # OTD-VSO-DSN-CR-016：交付事实 Topic（VSO 为生产者）
        - name: ${VSO_TOPIC_ORDER_DELIVERED:vso.order.delivered}
          partitions: 3
          replication-factor: 1

vso:
  outbox:
    aggregate-type: ORDER
    topics:
      # 发运申请事实（VSO → TMS），OTD-VSO-DSN-CR-012
      transport-applied: ${VSO_TOPIC_TRANSPORT_APPLIED:vso.transport.applied}
      # 交付事实（VSO 为生产者，OTD-VSO-DSN-CR-016）
      order-delivered: ${VSO_TOPIC_ORDER_DELIVERED:vso.order.delivered}
    relay:
      enabled: ${VSO_OUTBOX_RELAY_ENABLED:true}
      scan-interval-ms: ${VSO_OUTBOX_RELAY_SCAN_INTERVAL_MS:10000}
      batch-size: 100
      max-retry: 10
      base-backoff-ms: 5000
      max-backoff-ms: 300000

mybatis-plus:
  type-aliases-package: net.hwyz.iov.cloud.otd.vso.service.infrastructure.persistence.po

# 支付渠道配置（PaymentChannelConfig，OTD-VSO-DSN-CR-014 新增尾款超时）
payment:
  tail-payment-timeout-minutes: ${VSO_TAIL_PAYMENT_TIMEOUT_MINUTES:60}
